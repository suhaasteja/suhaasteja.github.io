name: Update Portfolio

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Fetch GitHub Repositories
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          
          echo "Fetching repos for user: $GITHUB_USER"
          echo "Full URL: https://api.github.com/users/$GITHUB_USER/repos?sort=updated&per_page=20&type=owner"
          
          # Fetch your public repos with verbose output
          HTTP_CODE=$(curl -w "%{http_code}" -o data/github-repos.json \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/users/$GITHUB_USER/repos?sort=updated&per_page=20&type=owner")
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response content (first 500 chars):"
          head -c 500 data/github-repos.json
          echo ""
          echo "File size:"
          ls -lh data/github-repos.json
          
          # Check if response is valid
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API call failed with status $HTTP_CODE"
            echo "[]" > data/github-repos.json
          fi
          
          # Create last updated timestamp
          echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/last-updated.json
      
      - name: Generate Featured Projects
        run: |
          node -e "
          const fs = require('fs');
          
          try {
            const content = fs.readFileSync('data/github-repos.json', 'utf8');
            console.log('Raw content:', content.substring(0, 100));
            
            const repos = JSON.parse(content);
            
            if (!Array.isArray(repos)) {
              console.error('Response is not an array');
              process.exit(1);
            }
            
            // Filter and sort repos
            const featured = repos
              .filter(r => r && !r.fork && typeof r.stargazers_count === 'number')
              .sort((a, b) => b.stargazers_count - a.stargazers_count)
              .slice(0, 10);
            
            fs.writeFileSync('data/github-repos.json', JSON.stringify(featured, null, 2));
            console.log('Featured projects updated:', featured.length);
          } catch (error) {
            console.error('Error processing repos:', error.message);
            // Create empty array as fallback
            fs.writeFileSync('data/github-repos.json', '[]');
          }
          "
      
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: GitHub projects $(date +%Y-%m-%d)" && git push)