name: Update Portfolio

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Fetch GitHub Repositories
        run: |
          mkdir -p data
          # Fetch your public repos with error handling
          curl -f -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/users/suhaasteja/repos?sort=updated&per_page=20 \
               > data/github-repos.json || echo "[]" > data/github-repos.json
          
          # Verify the file is valid JSON
          cat data/github-repos.json
          
          # Create last updated timestamp
          echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/last-updated.json
      
      - name: Generate Featured Projects
        run: |
          node -e "
          const fs = require('fs');
          
          try {
            const content = fs.readFileSync('data/github-repos.json', 'utf8');
            console.log('Raw content:', content.substring(0, 100));
            
            const repos = JSON.parse(content);
            
            if (!Array.isArray(repos)) {
              console.error('Response is not an array');
              process.exit(1);
            }
            
            // Filter and sort repos
            const featured = repos
              .filter(r => r && !r.fork && typeof r.stargazers_count === 'number')
              .sort((a, b) => b.stargazers_count - a.stargazers_count)
              .slice(0, 10);
            
            fs.writeFileSync('data/github-repos.json', JSON.stringify(featured, null, 2));
            console.log('Featured projects updated:', featured.length);
          } catch (error) {
            console.error('Error processing repos:', error.message);
            // Create empty array as fallback
            fs.writeFileSync('data/github-repos.json', '[]');
          }
          "
      
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: GitHub projects $(date +%Y-%m-%d)" && git push)
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # Keep the data directory in gh-pages
          keep_files: false